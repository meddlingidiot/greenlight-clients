name: Validate listings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A fork's pull request gets a read-only token. Nothing here needs more than that: the job
# reads the repository and says yes or no.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install "jsonschema[format]"

      # ffprobe measures clip duration, and --require-ffprobe below turns "not installed"
      # from a warning into a failure, so the 15s limit cannot be skipped here the way it
      # can be on a contributor's machine. The runner does not ship it: ubuntu-24.04 dropped
      # ffmpeg, and the step that used to "check" for it was `ffprobe -version | head -1`
      # in a shell without pipefail - which passes when head passes, ffprobe or no ffprobe.
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Check ffprobe is present
        id: ffprobe
        run: |
          path="$(command -v ffprobe)"
          "$path" -version | head -1
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # The checks are tested before they are trusted: nine fixtures that must each fail
      # for a named reason, and one that must pass.
      - name: Test the checks
        run: python tools/validate.py --self-test

      # The path the shell just proved, handed over explicitly: on one run Python's PATH
      # search came up empty on a runner where the step above had passed.
      - name: Validate listings
        run: python tools/validate.py --require-ffprobe --ffprobe "${{ steps.ffprobe.outputs.path }}"
